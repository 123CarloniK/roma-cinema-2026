<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Roma Cinema 2026 - Database Automatico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .header-title {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .header-subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        .status-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .status-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .status-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .status-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        
        .search-section {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .search-title {
            font-size: 14px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .search-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .search-controls input {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
        }
        
        .search-controls input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }
        
        .btn-search {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            white-space: nowrap;
        }
        
        .btn-search:hover {
            background: #764ba2;
        }
        
        .btn-reset {
            background: #999;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            white-space: nowrap;
        }
        
        .btn-reset:hover {
            background: #666;
        }
        
        .btn-refresh {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .btn-refresh:hover {
            background: #764ba2;
        }
        
        .filter-info {
            background: #e3f2fd;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            color: #1565c0;
            font-size: 14px;
        }
        
        .arenas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .arena-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .arena-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .arena-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .arena-location {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .arena-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .info-item {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 6px;
        }
        
        .info-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        .info-value {
            color: #333;
            font-weight: bold;
            margin-top: 3px;
        }
        
        .arena-films {
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        
        .films-title {
            font-size: 13px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .film-item {
            font-size: 13px;
            color: #555;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .film-item:last-child {
            border-bottom: none;
        }
        
        .film-title {
            font-weight: 600;
            color: #333;
        }
        
        .film-director {
            color: #999;
            font-size: 12px;
        }
        
        .film-date {
            color: #667eea;
            font-size: 12px;
            font-weight: bold;
            margin-top: 3px;
        }
        
        .film-time {
            color: #888;
            font-size: 12px;
        }
        
        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .no-results {
            background: #f5f5f5;
            border: 2px dashed #999;
            color: #666;
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
        }
        
        .cost-badge {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .cost-badge.pagamento {
            background: #fff3e0;
            color: #e65100;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">🎬 Roma Cinema 2026</div>
            <div class="header-subtitle">Database automatico con aggiornamento giornaliero</div>
            
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-label">📊 Status</div>
                    <div class="status-value" id="status">⏳ Caricamento...</div>
                </div>
                <div class="status-item">
                    <div class="status-label">🕐 Ultimo aggiornamento</div>
                    <div class="status-value" id="lastUpdate">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">📍 Arene disponibili</div>
                    <div class="status-value" id="arenaCount">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">🎬 Film totali</div>
                    <div class="status-value" id="filmCount">-</div>
                </div>
            </div>
            
            <button class="btn-refresh" onclick="location.reload()">🔄 Aggiorna</button>
        </header>
        
        <div class="search-section">
            <div class="search-title">🔍 Cerca film per data</div>
            <div class="search-controls">
                <input type="date" id="dateFilter" placeholder="Seleziona una data">
                <button class="btn-search" onclick="filterByDate()">🔍 Cerca</button>
                <button class="btn-reset" onclick="resetFilter()">✕ Annulla filtro</button>
            </div>
        </div>
        
        <div id="filterInfo"></div>
        <div id="content"></div>
    </div>

    <script>
        // Script aggiornato per gestire entrambi i formati di JSON:
        // - { metadata, arenas: [...] }
        // - [ { ... }, { ... } ] (array di arene con "filmSchedule")

        let allData = null;

        async function loadData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/123CarloniK/roma-cinema-2026/main/data/cinema-schedule.json');

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                let metadata = {};
                let arenas = [];

                // Se il JSON è già un oggetto con metadata + arenas
                if (data && data.metadata && Array.isArray(data.arenas)) {
                    metadata = data.metadata;
                    arenas = data.arenas;
                } else if (Array.isArray(data)) {
                    // Se il JSON è un array di "arenas" (formato attuale nel repo), normalizziamo
                    arenas = data.map(a => {
                        // Converti filmSchedule { "2026-07-08": [ {...}, ... ] } => films: [{... , date: "2026-07-08"}]
                        const films = [];
                        if (a.filmSchedule && typeof a.filmSchedule === 'object') {
                            Object.keys(a.filmSchedule).forEach(date => {
                                const list = a.filmSchedule[date];
                                if (Array.isArray(list)) {
                                    list.forEach(f => {
                                        films.push({ ...f, date });
                                    });
                                }
                            });
                        }

                        // Normalizza campi (location primo elemento di locations, sito completo se necessario)
                        const location = Array.isArray(a.locations) && a.locations.length > 0 ? a.locations[0] : (a.location || '');
                        let website = a.website || (a.contact && a.contact.website) || '';
                        if (website && !website.startsWith('http')) {
                            website = 'https://' + website;
                        }

                        return {
                            // manteniamo i campi usati dall'UI
                            name: a.name || a.title || '',
                            location,
                            capacity: a.capacity || a.capienza || '',
                            cost: a.cost || '',
                            films,
                            contact: { website },
                            // manteniamo i dati originali nel caso servano
                            __raw: a
                        };
                    });

                    metadata = {
                        lastUpdated: new Date().toISOString(),
                        totalArenas: arenas.length,
                        totalFilms: arenas.reduce((sum, ar) => sum + (ar.films ? ar.films.length : 0), 0)
                    };
                } else {
                    throw new Error('Formato dati non riconosciuto');
                }

                allData = { metadata, arenas };
                displayData(metadata, arenas);

            } catch (error) {
                console.error('Errore:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        ❌ Errore nel caricamento: ${error.message}<br>
                        Possibili cause:<br>
                        - Connessione internet instabile<br>
                        - GitHub non raggiungibile<br>
                        - File non correttamente uploadato su GitHub
                    </div>
                `;
                document.getElementById('status').textContent = '❌ ERRORE';
            }
        }

        function filterByDate() {
            const dateInput = document.getElementById('dateFilter').value;

            if (!dateInput) {
                alert('Seleziona una data!');
                return;
            }

            const selectedDate = dateInput;

            let filteredArenas = [];
            let totalFilmsOnDate = 0;

            allData.arenas.forEach(arena => {
                const filmsOnDate = (arena.films || []).filter(film => film.date === selectedDate);

                if (filmsOnDate.length > 0) {
                    filteredArenas.push({
                        ...arena,
                        films: filmsOnDate
                    });
                    totalFilmsOnDate += filmsOnDate.length;
                }
            });

            if (filteredArenas.length === 0) {
                document.getElementById('content').innerHTML = `
                    <div class="no-results">
                        🎬 Nessun film trovato per la data: <strong>${selectedDate}</strong>
                    </div>
                `;
                document.getElementById('filterInfo').innerHTML = `
                    <div class="filter-info">
                        🔍 Ricerca per data: <strong>${selectedDate}</strong> - Nessun risultato
                    </div>
                `;
            } else {
                document.getElementById('filterInfo').innerHTML = `
                    <div class="filter-info">
                        🔍 Ricerca per data: <strong>${selectedDate}</strong> - Trovati <strong>${totalFilmsOnDate}</strong> film in <strong>${filteredArenas.length}</strong> arene
                    </div>
                `;
                displayFilteredData(filteredArenas);
            }
        }

        function resetFilter() {
            document.getElementById('dateFilter').value = '';
            document.getElementById('filterInfo').innerHTML = '';
            if (allData) displayData(allData.metadata, allData.arenas);
        }

        function displayData(metadata, arenas) {
            document.getElementById('status').textContent = '✅ OK';

            const lastUpdate = new Date(metadata.lastUpdated);
            document.getElementById('lastUpdate').textContent = 
                lastUpdate.toLocaleDateString('it-IT') + ', ' + 
                lastUpdate.toLocaleTimeString('it-IT');

            document.getElementById('arenaCount').textContent = metadata.totalArenas;
            document.getElementById('filmCount').textContent = metadata.totalFilms;

            buildArenaCards(arenas);
        }

        function displayFilteredData(arenas) {
            buildArenaCards(arenas);
        }

        function buildArenaCards(arenas) {
            let html = '<div class="arenas-grid">';

            arenas.forEach(arena => {
                const costClass = arena.cost === 'GRATUITO' ? '' : 'pagamento';
                const filmCount = arena.films ? arena.films.length : 0;

                let filmsHtml = '';
                if (arena.films && arena.films.length > 0) {
                    filmsHtml = arena.films.map(film => `
                        <div class="film-item">
                            <div class="film-title">🎞️ ${film.title}</div>
                            <div class="film-director">${film.director || ''} (${film.year || ''})</div>
                            <div class="film-date">📅 ${film.date}</div>
                            <div class="film-time">🕐 ${film.time || 'Orario non specificato'}</div>
                        </div>
                    `).join('');
                }

                html += `
                    <div class="arena-card">
                        <div class="arena-name">${arena.name}</div>
                        <div class="arena-location">📍 ${arena.location}</div>
                        
                        <div class="arena-info">
                            <div class="info-item">
                                <div class="info-label">Capienza</div>
                                <div class="info-value">${arena.capacity || '-'} posti</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Costo</div>
                                <div class="info-value">
                                    <span class="cost-badge ${costClass}">${arena.cost}</span>
                                </div>
                            </div>
                        </div>
                        
                        ${arena.films && arena.films.length > 0 ? `
                            <div class="arena-films">
                                <div class="films-title">🎬 Film in programma (${filmCount})</div>
                                ${filmsHtml}
                            </div>
                        ` : ''}
                        
                        ${arena.contact && arena.contact.website ? `
                            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee;">
                                <a href="${arena.contact.website}" target="_blank" style="color: #667eea; text-decoration: none; font-size: 13px;">
                                    🌐 Visita sito →
                                </a>
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }

        window.addEventListener('load', loadData);
    </script>
</body>
</html>
