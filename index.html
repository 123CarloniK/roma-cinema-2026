<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Roma Cinema 2026 - Database Automatico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .header-title {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .header-subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        .status-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .status-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .status-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .status-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        
        .btn-refresh {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .btn-refresh:hover {
            background: #764ba2;
        }
        
        .arenas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .arena-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .arena-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .arena-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .arena-location {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .arena-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .info-item {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 6px;
        }
        
        .info-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        .info-value {
            color: #333;
            font-weight: bold;
            margin-top: 3px;
        }
        
        .arena-films {
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        
        .films-title {
            font-size: 13px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .film-item {
            font-size: 13px;
            color: #555;
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .film-item:last-child {
            border-bottom: none;
        }
        
        .film-title {
            font-weight: 600;
            color: #333;
        }
        
        .film-director {
            color: #999;
            font-size: 12px;
        }
        
        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .cost-badge {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .cost-badge.pagamento {
            background: #fff3e0;
            color: #e65100;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">🎬 Roma Cinema 2026</div>
            <div class="header-subtitle">Database automatico con aggiornamento giornaliero</div>
            
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-label">📊 Status</div>
                    <div class="status-value" id="status">⏳ Caricamento...</div>
                </div>
                <div class="status-item">
                    <div class="status-label">🕐 Ultimo aggiornamento</div>
                    <div class="status-value" id="lastUpdate">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">📍 Arene disponibili</div>
                    <div class="status-value" id="arenaCount">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">🎬 Film totali</div>
                    <div class="status-value" id="filmCount">-</div>
                </div>
            </div>
            
            <button class="btn-refresh" onclick="location.reload()">🔄 Aggiorna</button>
        </header>
        
        <div id="content"></div>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/123CarloniK/roma-cinema-2026/main/data/cinema-schedule.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                const metadata = data.metadata;
                const arenas = data.arenas;
                
                if (!Array.isArray(arenas)) {
                    throw new Error('Arenas non è un array');
                }
                
                displayData(metadata, arenas);
                
            } catch (error) {
                console.error('Errore:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        ❌ Errore nel caricamento: ${error.message}<br>
                        Possibili cause:<br>
                        - Connessione internet instabile<br>
                        - GitHub non raggiungibile<br>
                        - File non correttamente uploadato su GitHub
                    </div>
                `;
                document.getElementById('status').textContent = '❌ ERRORE';
            }
        }
        
        function displayData(metadata, arenas) {
            document.getElementById('status').textContent = '✅ OK';
            
            const lastUpdate = new Date(metadata.lastUpdated);
            document.getElementById('lastUpdate').textContent = 
                lastUpdate.toLocaleDateString('it-IT') + ', ' + 
                lastUpdate.toLocaleTimeString('it-IT');
            
            document.getElementById('arenaCount').textContent = metadata.totalArenas;
            document.getElementById('filmCount').textContent = metadata.totalFilms;
            
            let html = '<div class="arenas-grid">';
            
            arenas.forEach(arena => {
                const costClass = arena.cost === 'GRATUITO' ? '' : 'pagamento';
                const filmCount = arena.films ? arena.films.length : 0;
                
                let filmsHtml = '';
                if (arena.films && arena.films.length > 0) {
                    filmsHtml = arena.films.slice(0, 3).map(film => `
                        <div class="film-item">
                            <div class="film-title">🎞️ ${film.title}</div>
                            <div class="film-director">${film.director || ''} (${film.year || ''})</div>
                        </div>
                    `).join('');
                    
                    if (filmCount > 3) {
                        filmsHtml += `<div class="film-item" style="color: #667eea; font-weight: bold;">+ ${filmCount - 3} altri film</div>`;
                    }
                }
                
                html += `
                    <div class="arena-card">
                        <div class="arena-name">${arena.name}</div>
                        <div class="arena-location">📍 ${arena.location}</div>
                        
                        <div class="arena-info">
                            <div class="info-item">
                                <div class="info-label">Capienza</div>
                                <div class="info-value">${arena.capacity || '-'} posti</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Costo</div>
                                <div class="info-value">
                                    <span class="cost-badge ${costClass}">${arena.cost}</span>
                                </div>
                            </div>
                        </div>
                        
                        ${arena.films && arena.films.length > 0 ? `
                            <div class="arena-films">
                                <div class="films-title">🎬 Film programmati (${filmCount})</div>
                                ${filmsHtml}
                            </div>
                        ` : ''}
                        
                        ${arena.contact && arena.contact.website ? `
                            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee;">
                                <a href="${arena.contact.website}" target="_blank" style="color: #667eea; text-decoration: none; font-size: 13px;">
                                    🌐 Visita sito →
                                </a>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            
            html += '</div>';
            document.getElementById('content').innerHTML = html;
        }
        
        window.addEventListener('load', loadData);
    </script>
</body>
</html>
